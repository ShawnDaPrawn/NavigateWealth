# Dependency updates arrive as pull requests rather than as a scramble after an
# advisory. The fflate advisory (GHSA-px8p-9vwx-vf98) was handled by hand in
# 2026-08; this is what handles the next one.
#
# Updates are grouped so a week produces one or two reviewable PRs instead of
# twenty. `quality-check` gates each of them exactly as it gates a human PR, so
# a breaking bump shows up as a red check, not as a surprise in production.
version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '04:00'
      timezone: Africa/Johannesburg
    open-pull-requests-limit: 5
    versioning-strategy: increase
    labels:
      - dependencies
    commit-message:
      prefix: 'deps'
      prefix-development: 'deps(dev)'
    groups:
      # Patch and minor bumps are the boring majority. One PR for the lot.
      production-minor-patch:
        applies-to: version-updates
        dependency-type: production
        update-types: ['minor', 'patch']
      development-minor-patch:
        applies-to: version-updates
        dependency-type: development
        update-types: ['minor', 'patch']
      # Security fixes travel together and get looked at first.
      security:
        applies-to: security-updates
        patterns: ['*']
    ignore:
      # Version-pinned imports (`sonner@2.0.3`) are resolved through aliases in
      # both vite.config.ts and vitest.config.ts. A major bump here needs those
      # aliases updated in step, so it is a deliberate change, not a bot's.
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
      # pdfjs-dist from 5.6.83 up to 6.2.108 carries GHSA-hq66-cqwq-w95j
      # (arbitrary JavaScript on opening a malicious PDF); 5.5.x does not.
      # Hold 5.5.x until the deliberate 6.x upgrade.
      - dependency-name: 'pdfjs-dist'
        versions: ['>=5.6.83 <6.2.108']
      # CI and every quality gate run Node 20 (.nvmrc). These releases need
      # Node 22: supabase-js 2.110+ declares engines >=22, and docx 9.7.2+
      # depends on nanoid 6 (^22 || ^24 || >=26). Lift both ignores when
      # .nvmrc and the workflows move to Node 22 together.
      - dependency-name: '@supabase/supabase-js'
        versions: ['>=2.110.0']
      - dependency-name: '@jsr/supabase__supabase-js'
        versions: ['>=2.110.0']
      - dependency-name: 'docx'
        versions: ['>=9.7.2']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels:
      - dependencies
    commit-message:
      prefix: 'ci'
    groups:
      actions:
        patterns: ['*']
