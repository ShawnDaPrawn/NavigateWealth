# Keeps the pull-request list honest. A PR with no activity for 14 days gets a
# `stale` label and a comment; 14 more quiet days and it is closed. Any comment,
# push or review resets the clock, and a closed PR can be reopened with one
# click, so nothing is lost.
#
# Issues are never touched: the health-check and ops-task issues are a record,
# not a queue. Label a PR `keep-open` to exempt it; Dependabot PRs (label
# `dependencies`) are exempt too, since Dependabot rebases and replaces them
# itself.
name: Stale pull requests

on:
  schedule:
    # Daily, 04:23 UTC (06:23 in Johannesburg).
    - cron: '23 4 * * *'
  workflow_dispatch:

permissions:
  pull-requests: write
  issues: write

jobs:
  stale:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/stale@v11
        with:
          days-before-issue-stale: -1
          days-before-issue-close: -1
          days-before-pr-stale: 14
          days-before-pr-close: 14
          stale-pr-label: stale
          exempt-pr-labels: keep-open,dependencies
          stale-pr-message: >
            No activity on this pull request for 14 days, so it is marked stale.
            It will be closed in 14 days unless something happens here: a push,
            a review or a comment all reset the clock. Add the `keep-open`
            label to exempt it.
          close-pr-message: >
            Closed after 28 days without activity. Reopen it if the change is
            still wanted; the branch is untouched.
          operations-per-run: 60
