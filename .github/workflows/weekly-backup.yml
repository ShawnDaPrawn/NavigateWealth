# Weekly backup of the production Supabase project: Postgres, Storage objects,
# and an off-site copy that nobody can delete.
#
# WHY THIS EXISTS WHEN SUPABASE ALREADY BACKS UP
# ----------------------------------------------
# Supabase takes its own managed backups, and this does not replace them. What
# it adds is the part the production-readiness rubric actually asks for —
# "operationally verified, not merely documented":
#
#   • a backup that lives OUTSIDE the vendor, so a billing lapse, an account
#     lockout or an accidental project deletion is survivable;
#   • a copy under Object Lock, which survives an attacker who holds every
#     credential this project has. Supabase's managed backups live inside the
#     account being attacked, and the GitHub artifact below is deletable by any
#     repository admin — neither survives the account compromise it is meant to;
#   • Storage objects, which NO other backup covers. `pg_dump` carries
#     `storage.objects` (metadata rows) and not one byte of the files;
#   • proof each week that every artifact is readable and, for the database,
#     that it loads. A backup nobody has ever restored is a hope, not a control.
#
# THE THREE LEGS, AND WHAT EACH ONE PROVES
# ----------------------------------------
#   1. Database  — dump, decode every block, restore into a scratch Postgres,
#                  and diff row counts, indexes, constraints and RLS flags
#                  against the source.      (secret: SUPABASE_DB_URL)
#   2. Storage   — download every object, verify each against its listed size,
#                  and check the archive's file count against its manifest.
#                  (secrets: SUPABASE_URL + SUPABASE_SERVICE_ROLE_KEY)
#   3. Off-site  — put both artifacts into an Object Lock bucket and read the
#                  retention back off the stored object.
#                  (secret: NW_BACKUP_S3_BUCKET, plus credentials)
#
# Each leg is independently gated. A missing secret skips ONLY its own leg,
# with a warning and a row in the job summary, rather than failing the run — a
# red cross every Sunday teaches people to ignore the workflow. What a skip must
# never do is look like a backup: this workflow's first three runs were green
# while performing no work at all, because the one secret it needed was unset
# and every step skipped. The job summary now states which legs ran.
#
# SETUP: docs/runbooks/backup-and-restore.md has the click-path for all three,
# including the connection-string trap that will otherwise fail leg 1.
#
# A NOTE ON THE SERVICE-ROLE KEY. Leg 2 needs it, because Supabase Storage has
# no scoped credential — there is no read-only key that can list and download
# objects. That widens what a GitHub compromise yields, and it is a real cost,
# accepted because the alternative is leaving the least reproducible data in
# the platform with no backup whatsoever. It argues for leg 3: once the locked
# copy exists, an attacker holding every one of these secrets still cannot
# destroy the backups.
#
# The client is pinned to major 17 to match the server (PostgreSQL 17.6);
# pg_dump refuses to dump from a server newer than itself.

name: Weekly Backup

on:
  schedule:
    # 03:17 UTC on Sundays. Off the hour on purpose — :00 is when every
    # scheduled workflow on GitHub contends for runners.
    - cron: '17 3 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    name: weekly-backup
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # A throwaway Postgres to restore the dump INTO. This is the disaster-
    # recovery rehearsal, and it exists because a second Supabase project costs
    # money this project does not have. It is a faithful test of the thing that
    # actually matters — do these bytes load into a live schema, and is every
    # row still there — without a second project, and it runs every week instead
    # of once when somebody remembers.
    #
    # What it does NOT test: Supabase's own platform restore, or restoring the
    # Storage archive back INTO a project — leg 2 proves the objects are
    # downloaded and the archive is intact, not that a re-upload reproduces
    # them. `auth` IS covered: the shape comparison spans `public` and `auth`,
    # so `auth.users`, `auth.identities` and `auth.sessions` are diffed like any
    # other table. See docs/runbooks/backup-and-restore.md for the residual risk
    # that leaves, and docs/archive/production-readiness-ledger-2026.md § DR.
    services:
      scratch:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

    steps:
      # Not optional, and its absence was invisible. Four steps below run
      # scripts out of `scripts/ops/`, and without a checkout the runner has an
      # empty workspace — the first real run would have died on
      # `capture-db-shape.sh: No such file or directory`. Nothing caught it
      # because every run so far skipped every step that touches the repo, so
      # the workflow has never once needed a file it did not have.
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check which backup legs are configured
        id: guard
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          STORAGE_URL: ${{ secrets.SUPABASE_URL }}
          STORAGE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OFFSITE_BUCKET: ${{ secrets.NW_BACKUP_S3_BUCKET }}
        run: |
          set -euo pipefail

          # Three independent legs, each gated on its own secrets, so a missing
          # one cannot silently disable the others.
          configured=false
          storage=false
          offsite=false
          if [ -n "$DB_URL" ]; then configured=true; fi
          if [ -n "$STORAGE_URL" ] && [ -n "$STORAGE_KEY" ]; then storage=true; fi
          if [ -n "$OFFSITE_BUCKET" ]; then offsite=true; fi

          {
            echo "configured=$configured"
            echo "storage=$storage"
            echo "offsite=$offsite"
          } >> "$GITHUB_OUTPUT"

          # EVERY run writes what it actually did to the job summary.
          #
          # This workflow's first three scheduled runs were green while doing
          # nothing whatsoever: `SUPABASE_DB_URL` was never set, the guard
          # skipped all eight real steps, and the run reported success. Three
          # weeks of ticks said the disaster-recovery rehearsal was running. It
          # had never run once. A skip is still not a failure — a red cross
          # every Sunday teaches people to ignore the workflow — but it must
          # never again be indistinguishable from a backup, and the run page is
          # where somebody looks.
          {
            echo "### Weekly backup"
            echo ""
            echo "| Leg | Configured | Secret |"
            echo "| --- | --- | --- |"
            echo "| Database dump + restore rehearsal | $configured | \`SUPABASE_DB_URL\` |"
            echo "| Storage objects | $storage | \`SUPABASE_URL\` + \`SUPABASE_SERVICE_ROLE_KEY\` |"
            echo "| Off-site locked copy | $offsite | \`NW_BACKUP_S3_BUCKET\` |"
            echo ""
            if [ "$configured" = false ] || [ "$storage" = false ] || [ "$offsite" = false ]; then
              echo "> This run did **not** perform every leg. Setup: \`docs/runbooks/backup-and-restore.md\`."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$configured" = false ]; then
            echo "::warning::SUPABASE_DB_URL is not set — skipping the dump and the restore rehearsal. See docs/runbooks/backup-and-restore.md."
          fi
          if [ "$storage" = false ]; then
            echo "::warning::SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY are not set — skipping the Storage backup. Storage objects are NOT in the database dump."
          fi
          if [ "$offsite" = false ]; then
            echo "::warning::NW_BACKUP_S3_BUCKET is not set — skipping the off-site locked copy. The only copy will be a 90-day GitHub artifact, deletable by any repository admin."
          fi

      - name: Install PostgreSQL 17 client
        if: steps.guard.outputs.configured == 'true'
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] \
            https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          pg_dump --version

      - name: Snapshot the source shape before the dump
        if: steps.guard.outputs.configured == 'true'
        env:
          PGSSLMODE: require
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          # Bracketing the dump between two snapshots is what makes the
          # comparison sound. pg_dump reads from a consistent snapshot taken
          # when it STARTS, so a count taken only afterwards describes a newer
          # database — and this one has cron jobs writing to it, so a single
          # after-count would fail the job on a backup that is perfectly good.
          # The restored count has to land inside the range the source held
          # while the dump ran. See scripts/ops/compare-restore.py.
          bash scripts/ops/capture-db-shape.sh "$DB_URL" source-before.csv
          echo "before the dump:"; cat source-before.csv

      - name: Dump
        if: steps.guard.outputs.configured == 'true'
        env:
          # Never interpolated into the command line — a connection string on
          # argv is visible to every other process on the runner.
          PGSSLMODE: require
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          stamp="$(date -u +%Y-%m-%dT%H-%M-%SZ)"
          echo "BACKUP_FILE=navigatewealth-$stamp.dump" >> "$GITHUB_ENV"
          # Custom format: compressed, and the only format pg_restore can list
          # selectively. --no-owner/--no-acl so it restores into a fresh project
          # whose roles differ.
          pg_dump --format=custom --no-owner --no-acl --verbose \
            --file="navigatewealth-$stamp.dump" "$DB_URL" 2> dump.log || {
              echo "::error::pg_dump failed"; tail -40 dump.log; exit 1; }

      - name: Snapshot the source shape after the dump
        if: steps.guard.outputs.configured == 'true'
        env:
          PGSSLMODE: require
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          bash scripts/ops/capture-db-shape.sh "$DB_URL" source-after.csv
          echo "after the dump:"; cat source-after.csv

      - name: Verify the archive is readable
        if: steps.guard.outputs.configured == 'true'
        run: |
          set -euo pipefail
          size=$(stat -c%s "$BACKUP_FILE")
          echo "archive: $BACKUP_FILE ($size bytes)"

          # Three checks, cheapest first, each catching something the others
          # cannot. Order matters only for the quality of the error message.

          # 1. A dump that is suspiciously small is a failed dump that exited 0.
          if [ "$size" -lt 51200 ]; then
            echo "::error::Backup is only $size bytes — treating as a failed dump."; exit 1
          fi

          # 2. TOC contents: is this the RIGHT database, and a whole one?
          #    Catches a wrong connection string or an accidentally filtered
          #    dump, which a byte-level check never would.
          pg_restore --list "$BACKUP_FILE" > toc.txt
          entries=$(wc -l < toc.txt)
          echo "restore TOC entries: $entries"
          if [ "$entries" -lt 20 ]; then
            echo "::error::Only $entries TOC entries — the dump is not a full database."; exit 1
          fi
          grep -q "kv_store_91ed8379" toc.txt || {
            echo "::error::kv_store_91ed8379 is absent from the dump — wrong database or a filtered dump."; exit 1; }

          # 3. THE ACTUAL INTEGRITY CHECK: stream and decompress every data
          #    block.
          #
          #    The TOC sits at the FRONT of a custom-format archive, so
          #    `--list` succeeds on a dump truncated after it — the two checks
          #    above would then pass and this job would upload a corrupt file
          #    labelled "verified readable", which is worse than no check at
          #    all because it manufactures false confidence. Converting the
          #    whole archive to a SQL script and discarding the output forces
          #    every block to be read and decompressed; a truncated or
          #    corrupted archive fails here.
          #
          #    Still not a restore — it proves the bytes are intact and
          #    decodable, not that they load into a live schema. A scratch
          #    restore remains the real bar and is tracked in
          #    docs/archive/production-readiness-ledger-2026.md under DR.
          pg_restore --file=/dev/null "$BACKUP_FILE" 2> restore-check.log || {
            echo "::error::Archive failed a full decode — truncated or corrupt beyond the TOC.";
            tail -40 restore-check.log; exit 1; }

          echo "Backup verified: TOC complete AND every data block decoded."

      - name: Restore into a scratch database and compare it to the source
        if: steps.guard.outputs.configured == 'true'
        env:
          PGSSLMODE: require
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SCRATCH: postgresql://postgres:postgres@localhost:5432/postgres
        run: |
          set -euo pipefail

          # Supabase's roles do not exist in a vanilla Postgres and the dump
          # references them in grants. Plain CREATE ROLE with the error
          # swallowed, not a guarded DO block: dollar-quoting through YAML, then
          # bash, then psql is three layers of escaping and exactly the kind of
          # thing that breaks silently.
          for role in anon authenticated service_role supabase_admin \
                      supabase_auth_admin supabase_storage_admin authenticator \
                      dashboard_user pgbouncer; do
            psql "$SCRATCH" -q -c "create role $role NOLOGIN" 2>/dev/null || true
          done

          # Install every source extension the scratch image actually has, so
          # the restore is as faithful as this environment allows and the
          # allowlist below stays as narrow as possible.
          psql "$DB_URL" -At -c "select extname from pg_extension" > src-ext.txt
          psql "$SCRATCH" -At -c "select name from pg_available_extensions" > avail-ext.txt
          : > unavailable-ext.txt
          while read -r ext; do
            [ -z "$ext" ] && continue
            if grep -qxF "$ext" avail-ext.txt; then
              psql "$SCRATCH" -q -c "create extension if not exists \"$ext\" cascade" 2>/dev/null || true
            else
              echo "$ext" >> unavailable-ext.txt
            fi
          done < src-ext.txt
          echo "extensions the scratch image cannot provide:"; cat unavailable-ext.txt

          # Schemas owned EXCLUSIVELY by an unavailable extension. Errors naming
          # these are cascades of the missing extension, not restore defects.
          # Derived rather than hard-coded, and deliberately not schemas like
          # `extensions` that also host extensions which DO install — allowlisting
          # those would hide real failures.
          psql "$DB_URL" -At -c "
            select n.nspname
            from pg_extension e join pg_namespace n on n.oid = e.extnamespace
            where n.nspname not in ('pg_catalog','public')
            group by n.nspname
            having bool_and(e.extname in ($(sed "s/.*/'&'/" unavailable-ext.txt | paste -sd, - | grep . || echo "''")))
          " > exclusive-schemas.txt || : > exclusive-schemas.txt
          echo "schemas exclusive to those extensions:"; cat exclusive-schemas.txt

          # NO --exit-on-error: the run must continue past the missing-extension
          # failures so the rest of the schema still loads. Every error is then
          # classified below.
          pg_restore --no-owner --no-acl --dbname="$SCRATCH" "$BACKUP_FILE" 2> restore.log || true

          grep "^pg_restore: error" restore.log > all-errors.txt || : > all-errors.txt
          cp all-errors.txt unexpected-errors.txt
          while read -r token; do
            [ -z "$token" ] && continue
            grep -v -- "$token" unexpected-errors.txt > tmp.txt || : > tmp.txt
            mv tmp.txt unexpected-errors.txt
          done < <(cat unavailable-ext.txt exclusive-schemas.txt)

          expected=$(( $(wc -l < all-errors.txt) - $(wc -l < unexpected-errors.txt) ))
          echo "restore errors: $(wc -l < all-errors.txt) total, $expected attributable to missing extensions"

          # THE FIRST GATE, and the one the previous version was missing. A
          # restore that loads every row but fails to recreate a constraint,
          # index, view, function, trigger or policy is not a usable restore —
          # it is a pile of data with no keys — and a row-count check alone
          # passes it happily. Anything not attributable to an extension this
          # image cannot install fails the rehearsal.
          if [ -s unexpected-errors.txt ]; then
            echo "::error::Restore produced errors unrelated to missing extensions."
            head -40 unexpected-errors.txt
            exit 1
          fi

          bash scripts/ops/capture-db-shape.sh "$SCRATCH" restored.csv
          echo "restored:"; cat restored.csv

          # THE SECOND GATE: every row, index, constraint and row-security flag.
          python3 scripts/ops/compare-restore.py source-before.csv source-after.csv restored.csv

      # ----------------------------------------------------------------------
      # STORAGE. Everything above this line backs up Postgres, which carries
      # `storage.objects` — the metadata rows — and not one byte of the files.
      # Signed e-sign PDFs, client documents, policy documents and the e-sign
      # certificates live only in Supabase Storage, which has no versioning and
      # no soft delete. Until this step existed they had no backup at all.
      # ----------------------------------------------------------------------
      - name: Back up Supabase Storage objects
        if: steps.guard.outputs.storage == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # A total of zero objects means the credential can list buckets but
          # cannot see their contents, which produces an empty archive that
          # exits 0. Same class of false confidence as a TOC-only dump check.
          NW_BACKUP_MIN_OBJECTS: '1'
        run: |
          set -euo pipefail
          stamp="$(date -u +%Y-%m-%dT%H-%M-%SZ)"
          archive="navigatewealth-storage-$stamp.tar.gz"
          echo "STORAGE_FILE=$archive" >> "$GITHUB_ENV"

          node scripts/ops/backup-storage.mjs storage-backup
          tar -czf "$archive" -C storage-backup .

          # `tar -tzf` streams and decompresses the entire archive, so a
          # truncated or corrupt tarball fails here rather than on the day of
          # the restore. The object count and the file count must then agree: a
          # tarball holding fewer files than the backup claims to have written
          # is a partial backup wearing a complete backup's inventory.
          #
          # The count is read from `object-count.txt` rather than by counting
          # manifest lines, because an object key may contain a newline. The
          # manifest quotes that correctly and `wc -l` would over-count it,
          # failing a backup that is perfectly good.
          expected=$(cat storage-backup/object-count.txt)
          archived=$(tar -tzf "$archive" | grep -c '^\./objects/.*[^/]$' || true)
          echo "objects backed up: $expected, files in archive: $archived"
          if [ "$expected" -ne "$archived" ]; then
            echo "::error::The backup wrote $expected objects but the archive holds $archived."
            exit 1
          fi
          echo "storage archive: $archive ($(stat -c%s "$archive") bytes)"
          cat storage-backup/buckets.csv

      # ----------------------------------------------------------------------
      # OFF-SITE. The GitHub artifact below is off-VENDOR but not off-ACCOUNT:
      # any repository admin can delete it, which is precisely the principal
      # whose compromise the copy exists to survive. Object Lock in COMPLIANCE
      # mode is the copy nobody — not the CI credential, not the cloud account
      # root — can delete before it expires.
      # ----------------------------------------------------------------------
      - name: Copy the backups off-site into locked object storage
        if: steps.guard.outputs.offsite == 'true'
        env:
          NW_BACKUP_S3_BUCKET: ${{ secrets.NW_BACKUP_S3_BUCKET }}
          NW_BACKUP_S3_ENDPOINT: ${{ secrets.NW_BACKUP_S3_ENDPOINT }}
          NW_BACKUP_S3_REGION: ${{ vars.NW_BACKUP_S3_REGION }}
          NW_BACKUP_S3_PREFIX: ${{ vars.NW_BACKUP_S3_PREFIX }}
          NW_BACKUP_RETENTION_DAYS: ${{ vars.NW_BACKUP_RETENTION_DAYS }}
          NW_BACKUP_LOCK_MODE: ${{ vars.NW_BACKUP_LOCK_MODE }}
          AWS_ACCESS_KEY_ID: ${{ secrets.NW_BACKUP_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.NW_BACKUP_AWS_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          files=()
          if [ -n "${BACKUP_FILE:-}" ] && [ -f "${BACKUP_FILE:-}" ]; then files+=("$BACKUP_FILE"); fi
          if [ -n "${STORAGE_FILE:-}" ] && [ -f "${STORAGE_FILE:-}" ]; then files+=("$STORAGE_FILE"); fi

          # Reaching an off-site step with nothing to send means a leg above was
          # skipped or produced nothing. Uploading zero files and reporting
          # success is the failure this workflow keeps re-learning.
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::The off-site copy is configured but no backup artifact was produced. Check the guard table in the job summary."
            exit 1
          fi

          bash scripts/ops/upload-offsite.sh "${files[@]}"

      - name: Upload
        if: steps.guard.outputs.configured == 'true' || steps.guard.outputs.storage == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: db-backup-${{ github.run_id }}
          path: |
            ${{ env.BACKUP_FILE }}
            ${{ env.STORAGE_FILE }}
          # GitHub's maximum. The dump holds client PII, so it is deliberately
          # NOT kept indefinitely here — this is a rolling off-vendor copy, and
          # longer-term retention belongs in encrypted object storage with a
          # documented lifecycle policy.
          retention-days: 90
          if-no-files-found: error
