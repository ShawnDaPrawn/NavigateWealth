# Weekly logical backup of the production Postgres, with an integrity check.
#
# WHY THIS EXISTS WHEN SUPABASE ALREADY BACKS UP
# ----------------------------------------------
# Supabase takes its own managed backups, and this does not replace them. What
# it adds is the part the production-readiness rubric actually asks for —
# "operationally verified, not merely documented":
#
#   • a backup that lives OUTSIDE the vendor, so a billing lapse, an account
#     lockout or an accidental project deletion is survivable;
#   • proof each week that the dump is READABLE, not merely produced. A backup
#     nobody has ever restored is a hope, not a control. `pg_restore --list`
#     parses the archive's table of contents and fails on a truncated or
#     corrupt file — the cheap end of a restore test, run every time.
#
# WHAT IT DOES NOT DO YET
# -----------------------
# It does not restore into a scratch database and diff the result. That needs a
# throwaway Postgres and a few minutes of runner time; the TOC parse is the
# honest 80% until someone decides that is worth adding.
#
# SETUP (one secret, and the job no-ops safely without it)
# -------------------------------------------------------
#   Settings → Secrets and variables → Actions → New repository secret
#     Name:  SUPABASE_DB_URL
#     Value: the Session-pooler connection string from
#            Supabase → Project Settings → Database → Connection string → URI
#            (include the password; prefer a read-only role if one exists)
#
# Until that secret is set, every run SKIPS with a clear message rather than
# failing — a red cross every Sunday teaches people to ignore the workflow.
#
# The client is pinned to major 17 to match the server (PostgreSQL 17.6);
# pg_dump refuses to dump from a server newer than itself.

name: Weekly Backup

on:
  schedule:
    # 03:17 UTC on Sundays. Off the hour on purpose — :00 is when every
    # scheduled workflow on GitHub contends for runners.
    - cron: '17 3 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    name: weekly-backup
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # A throwaway Postgres to restore the dump INTO. This is the disaster-
    # recovery rehearsal, and it exists because a second Supabase project costs
    # money this project does not have. It is a faithful test of the thing that
    # actually matters — do these bytes load into a live schema, and is every
    # row still there — without a second project, and it runs every week instead
    # of once when somebody remembers.
    #
    # What it does NOT test: Supabase's own platform restore, Storage objects
    # (the dump holds only their metadata), or auth users. See
    # docs/archive/production-readiness-ledger-2026.md § DR for the residual risk that leaves.
    services:
      scratch:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

    steps:
      - name: Check the database secret is configured
        id: guard
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$DB_URL" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::SUPABASE_DB_URL is not set — skipping. See the header of this workflow for setup."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install PostgreSQL 17 client
        if: steps.guard.outputs.configured == 'true'
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] \
            https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          pg_dump --version

      - name: Snapshot the source shape before the dump
        if: steps.guard.outputs.configured == 'true'
        env:
          PGSSLMODE: require
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          # Bracketing the dump between two snapshots is what makes the
          # comparison sound. pg_dump reads from a consistent snapshot taken
          # when it STARTS, so a count taken only afterwards describes a newer
          # database — and this one has cron jobs writing to it, so a single
          # after-count would fail the job on a backup that is perfectly good.
          # The restored count has to land inside the range the source held
          # while the dump ran. See scripts/compare-restore.py.
          bash scripts/capture-db-shape.sh "$DB_URL" source-before.csv
          echo "before the dump:"; cat source-before.csv

      - name: Dump
        if: steps.guard.outputs.configured == 'true'
        env:
          # Never interpolated into the command line — a connection string on
          # argv is visible to every other process on the runner.
          PGSSLMODE: require
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          stamp="$(date -u +%Y-%m-%dT%H-%M-%SZ)"
          echo "BACKUP_FILE=navigatewealth-$stamp.dump" >> "$GITHUB_ENV"
          # Custom format: compressed, and the only format pg_restore can list
          # selectively. --no-owner/--no-acl so it restores into a fresh project
          # whose roles differ.
          pg_dump --format=custom --no-owner --no-acl --verbose \
            --file="navigatewealth-$stamp.dump" "$DB_URL" 2> dump.log || {
              echo "::error::pg_dump failed"; tail -40 dump.log; exit 1; }

      - name: Snapshot the source shape after the dump
        if: steps.guard.outputs.configured == 'true'
        env:
          PGSSLMODE: require
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          bash scripts/capture-db-shape.sh "$DB_URL" source-after.csv
          echo "after the dump:"; cat source-after.csv

      - name: Verify the archive is readable
        if: steps.guard.outputs.configured == 'true'
        run: |
          set -euo pipefail
          size=$(stat -c%s "$BACKUP_FILE")
          echo "archive: $BACKUP_FILE ($size bytes)"

          # Three checks, cheapest first, each catching something the others
          # cannot. Order matters only for the quality of the error message.

          # 1. A dump that is suspiciously small is a failed dump that exited 0.
          if [ "$size" -lt 51200 ]; then
            echo "::error::Backup is only $size bytes — treating as a failed dump."; exit 1
          fi

          # 2. TOC contents: is this the RIGHT database, and a whole one?
          #    Catches a wrong connection string or an accidentally filtered
          #    dump, which a byte-level check never would.
          pg_restore --list "$BACKUP_FILE" > toc.txt
          entries=$(wc -l < toc.txt)
          echo "restore TOC entries: $entries"
          if [ "$entries" -lt 20 ]; then
            echo "::error::Only $entries TOC entries — the dump is not a full database."; exit 1
          fi
          grep -q "kv_store_91ed8379" toc.txt || {
            echo "::error::kv_store_91ed8379 is absent from the dump — wrong database or a filtered dump."; exit 1; }

          # 3. THE ACTUAL INTEGRITY CHECK: stream and decompress every data
          #    block.
          #
          #    The TOC sits at the FRONT of a custom-format archive, so
          #    `--list` succeeds on a dump truncated after it — the two checks
          #    above would then pass and this job would upload a corrupt file
          #    labelled "verified readable", which is worse than no check at
          #    all because it manufactures false confidence. Converting the
          #    whole archive to a SQL script and discarding the output forces
          #    every block to be read and decompressed; a truncated or
          #    corrupted archive fails here.
          #
          #    Still not a restore — it proves the bytes are intact and
          #    decodable, not that they load into a live schema. A scratch
          #    restore remains the real bar and is tracked in
          #    docs/archive/production-readiness-ledger-2026.md under DR.
          pg_restore --file=/dev/null "$BACKUP_FILE" 2> restore-check.log || {
            echo "::error::Archive failed a full decode — truncated or corrupt beyond the TOC.";
            tail -40 restore-check.log; exit 1; }

          echo "Backup verified: TOC complete AND every data block decoded."

      - name: Restore into a scratch database and compare it to the source
        if: steps.guard.outputs.configured == 'true'
        env:
          PGSSLMODE: require
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SCRATCH: postgresql://postgres:postgres@localhost:5432/postgres
        run: |
          set -euo pipefail

          # Supabase's roles do not exist in a vanilla Postgres and the dump
          # references them in grants. Plain CREATE ROLE with the error
          # swallowed, not a guarded DO block: dollar-quoting through YAML, then
          # bash, then psql is three layers of escaping and exactly the kind of
          # thing that breaks silently.
          for role in anon authenticated service_role supabase_admin \
                      supabase_auth_admin supabase_storage_admin authenticator \
                      dashboard_user pgbouncer; do
            psql "$SCRATCH" -q -c "create role $role NOLOGIN" 2>/dev/null || true
          done

          # Install every source extension the scratch image actually has, so
          # the restore is as faithful as this environment allows and the
          # allowlist below stays as narrow as possible.
          psql "$DB_URL" -At -c "select extname from pg_extension" > src-ext.txt
          psql "$SCRATCH" -At -c "select name from pg_available_extensions" > avail-ext.txt
          : > unavailable-ext.txt
          while read -r ext; do
            [ -z "$ext" ] && continue
            if grep -qxF "$ext" avail-ext.txt; then
              psql "$SCRATCH" -q -c "create extension if not exists \"$ext\" cascade" 2>/dev/null || true
            else
              echo "$ext" >> unavailable-ext.txt
            fi
          done < src-ext.txt
          echo "extensions the scratch image cannot provide:"; cat unavailable-ext.txt

          # Schemas owned EXCLUSIVELY by an unavailable extension. Errors naming
          # these are cascades of the missing extension, not restore defects.
          # Derived rather than hard-coded, and deliberately not schemas like
          # `extensions` that also host extensions which DO install — allowlisting
          # those would hide real failures.
          psql "$DB_URL" -At -c "
            select n.nspname
            from pg_extension e join pg_namespace n on n.oid = e.extnamespace
            where n.nspname not in ('pg_catalog','public')
            group by n.nspname
            having bool_and(e.extname in ($(sed "s/.*/'&'/" unavailable-ext.txt | paste -sd, - | grep . || echo "''")))
          " > exclusive-schemas.txt || : > exclusive-schemas.txt
          echo "schemas exclusive to those extensions:"; cat exclusive-schemas.txt

          # NO --exit-on-error: the run must continue past the missing-extension
          # failures so the rest of the schema still loads. Every error is then
          # classified below.
          pg_restore --no-owner --no-acl --dbname="$SCRATCH" "$BACKUP_FILE" 2> restore.log || true

          grep "^pg_restore: error" restore.log > all-errors.txt || : > all-errors.txt
          cp all-errors.txt unexpected-errors.txt
          while read -r token; do
            [ -z "$token" ] && continue
            grep -v -- "$token" unexpected-errors.txt > tmp.txt || : > tmp.txt
            mv tmp.txt unexpected-errors.txt
          done < <(cat unavailable-ext.txt exclusive-schemas.txt)

          expected=$(( $(wc -l < all-errors.txt) - $(wc -l < unexpected-errors.txt) ))
          echo "restore errors: $(wc -l < all-errors.txt) total, $expected attributable to missing extensions"

          # THE FIRST GATE, and the one the previous version was missing. A
          # restore that loads every row but fails to recreate a constraint,
          # index, view, function, trigger or policy is not a usable restore —
          # it is a pile of data with no keys — and a row-count check alone
          # passes it happily. Anything not attributable to an extension this
          # image cannot install fails the rehearsal.
          if [ -s unexpected-errors.txt ]; then
            echo "::error::Restore produced errors unrelated to missing extensions."
            head -40 unexpected-errors.txt
            exit 1
          fi

          bash scripts/capture-db-shape.sh "$SCRATCH" restored.csv
          echo "restored:"; cat restored.csv

          # THE SECOND GATE: every row, index, constraint and row-security flag.
          python3 scripts/compare-restore.py source-before.csv source-after.csv restored.csv

      - name: Upload
        if: steps.guard.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_id }}
          path: ${{ env.BACKUP_FILE }}
          # GitHub's maximum. The dump holds client PII, so it is deliberately
          # NOT kept indefinitely here — this is a rolling off-vendor copy, and
          # longer-term retention belongs in encrypted object storage with a
          # documented lifecycle policy.
          retention-days: 90
          if-no-files-found: error
