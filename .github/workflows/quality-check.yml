name: Quality Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  quality-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run production build
        shell: bash
        run: |
          set +e
          npm run build 2>&1 | tee quality-build.log
          echo "${PIPESTATUS[0]}" > quality-build.exit
          exit 0

      - name: Run Vitest
        shell: bash
        run: |
          set +e
          npm test -- --reporter=json --outputFile=quality-vitest-report.json 2>&1 | tee quality-test.log
          echo "${PIPESTATUS[0]}" > quality-test.exit
          exit 0

      - name: Run typecheck (non-blocking baseline)
        # SPA type errors are being burned down from a baseline of ~1308
        # (run `npm run typecheck` locally). This step is intentionally
        # non-blocking until the count reaches zero, at which point it should
        # be moved into the "Enforce quality gates" step below. The Supabase
        # Edge Function (Deno) source is excluded here and must be checked
        # separately with `deno check`.
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npm run typecheck 2>&1 | tee quality-typecheck.log
          echo "${PIPESTATUS[0]}" > quality-typecheck.exit
          exit 0

      - name: Run FNA intake test suite
        shell: bash
        run: |
          set +e
          npm test -- src/supabase/functions/server/__tests__/fna-intake- src/components/client/fna-intake/__tests__/ src/shared/fna-intake/__tests__/ 2>&1 | tee quality-fna-intake-test.log
          echo "${PIPESTATUS[0]}" > quality-fna-intake-test.exit
          exit 0

      - name: Run form prefill test suite
        shell: bash
        run: |
          set +e
          npm test -- src/supabase/functions/server/__tests__/form-prefill- src/supabase/functions/server/__tests__/esign-prefill.test.ts src/components/admin/modules/risk-planning-fna/components/__tests__/Step1InformationGathering.prefill-guard.test.ts 2>&1 | tee quality-form-prefill-test.log
          echo "${PIPESTATUS[0]}" > quality-form-prefill-test.exit
          exit 0

      - name: Run dependency audit
        shell: bash
        run: npm audit --json > quality-npm-audit-report.json || true

      - name: Publish quality issue snapshot
        shell: bash
        env:
          QUALITY_ISSUES_INGEST_URL: https://vpjmdsltwrnpefzcgdmz.supabase.co/functions/v1/make-server-91ed8379/quality-issues/ingest-ci-report
          QUALITY_ISSUES_INGEST_TOKEN: ${{ secrets.QUALITY_ISSUES_INGEST_TOKEN }}
        run: node scripts/publish-quality-report.mjs

      - name: Upload quality reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports
          path: |
            quality-build.log
            quality-build.exit
            quality-test.log
            quality-test.exit
            quality-typecheck.log
            quality-typecheck.exit
            quality-vitest-report.json
            quality-npm-audit-report.json
            quality-issues-payload.json

      - name: Enforce quality gates
        # Runs last so the dashboard snapshot is published and artifacts are
        # uploaded even on failure, but the job still fails when the build or
        # the test suite failed. Previously these exit codes were captured to
        # files and then discarded (`set +e ... exit 0`), so a red build/test
        # could still report a green "Quality Check". Typecheck is not gated
        # here yet (see the non-blocking step above).
        if: always()
        shell: bash
        run: |
          build_exit="$(cat quality-build.exit 2>/dev/null || echo 1)"
          test_exit="$(cat quality-test.exit 2>/dev/null || echo 1)"
          typecheck_exit="$(cat quality-typecheck.exit 2>/dev/null || echo 'n/a')"
          echo "build exit code:     $build_exit"
          echo "test exit code:      $test_exit"
          echo "typecheck exit code: $typecheck_exit (informational, not gated)"
          failed=0
          if [ "$build_exit" != "0" ]; then echo "::error::Production build failed (see quality-build.log)"; failed=1; fi
          if [ "$test_exit" != "0" ]; then echo "::error::Vitest suite failed (see quality-test.log)"; failed=1; fi
          if [ "$failed" != "0" ]; then
            echo "Quality gates FAILED."
            exit 1
          fi
          echo "Quality gates passed."
