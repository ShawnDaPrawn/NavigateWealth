name: Quality Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  quality-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Deno
        # Needed for the Supabase Edge Function (Deno) typecheck below. The Vite
        # build / Vitest / SPA tsc steps do NOT need Deno.
        uses: denoland/setup-deno@v2
        with:
          # Pinned (not the floating v2.x) so `deno check`'s error count is
          # deterministic — the ratchet gate compares it against a committed
          # baseline (.deno-check-baseline), which is only meaningful against a
          # fixed compiler version. Bump deliberately (and re-measure the floor).
          deno-version: v2.8.1

      - name: Run production build
        shell: bash
        env:
          # The Supabase articles endpoint uses a host allowlist that blocks
          # CI runner IPs. Skip the hard-fail so the build verifies compilation
          # without depending on a restricted external API.
          SEO_REQUIRE_ARTICLES: 'false'
        run: |
          set +e
          npm run build 2>&1 | tee quality-build.log
          echo "${PIPESTATUS[0]}" > quality-build.exit
          exit 0

      - name: Run Vitest (with coverage gate)
        # Runs the suite WITH coverage so the regression floor in
        # vitest.config.ts is enforced: if coverage drops below the configured
        # thresholds, Vitest exits non-zero and this step's exit code (gated in
        # "Enforce quality gates") fails the job. Local `npm test` stays
        # coverage-free for speed. Floors are intentionally set just below the
        # current (low) coverage and ratchet up as characterization tests grow.
        shell: bash
        run: |
          set +e
          npm test -- --coverage --reporter=json --outputFile=quality-vitest-report.json 2>&1 | tee quality-test.log
          echo "${PIPESTATUS[0]}" > quality-test.exit
          exit 0

      - name: Run backend coverage (per-layer floor)
        # Stage A / F4. The SPA Vitest step above excludes
        # src/supabase/functions/** from coverage, so the ~136K-line Deno
        # backend — auth decisions, client PII, e-signatures — had NO coverage
        # measurement at all, and the single blended "~31%" described the SPA
        # only. This measures and floors the backend separately, so the two
        # layers are reported as two numbers.
        #
        # First honest measurement (2026-08-21): statements 13.43%,
        # branches 9.38%, functions 12.88%, lines 13.79%. Floors sit just below
        # in vitest.config.server.ts and ratchet UP as backend tests land.
        shell: bash
        run: |
          set +e
          npm run test:coverage:server 2>&1 | tee quality-test-server.log
          echo "${PIPESTATUS[0]}" > quality-test-server.exit
          exit 0

      - name: Run typecheck (blocking)
        # SPA type errors were burned down to ZERO (from a baseline of ~1308).
        # This check is now GATED in "Enforce quality gates" below, so any new
        # type error fails CI. The Supabase Edge Function (Deno) source is
        # excluded here (tsconfig.typecheck.json) and must be checked separately
        # with `deno check`.
        shell: bash
        run: |
          set +e
          npm run typecheck 2>&1 | tee quality-typecheck.log
          echo "${PIPESTATUS[0]}" > quality-typecheck.exit
          exit 0

      - name: Run ESLint (blocking + warning ratchet)
        # ESLint runs at 0 errors; any new lint ERROR fails CI via "Enforce
        # quality gates" below. Formatting is enforced per-commit via the Husky
        # + lint-staged pre-commit hook (Prettier on staged files), not as a
        # repo-wide CI check, because several guardrail/golden tests assert on
        # exact source text and a repo-wide reformat would trip them.
        #
        # WARNING RATCHET (2026-08-21, Stage A / F2): warnings used to be
        # completely ungated, so the backlog could grow silently — including the
        # `max-lines` file-size budget, which warned constantly and blocked
        # nothing. The warning COUNT is now compared against the committed floor
        # in .eslint-warning-baseline; the job fails if it RISES. This is
        # deliberately the TOTAL count rather than a max-lines-only count: it is
        # strictly stronger (a new oversized file, a new exhaustive-deps
        # suppression, or a new unused var all raise it) and needs one mechanism
        # instead of several.
        #
        # Floor is currently 55: max-lines 40, react-refresh 9,
        # no-irregular-whitespace 2, exhaustive-deps 2, no-unused-vars 1,
        # prefer-const 1. LOWER .eslint-warning-baseline as warnings are fixed.
        #
        # F2 burn-down path for the file-size budget: `max-lines` is 1000 in
        # eslint.config.mjs (skipBlankLines + skipComments; scripts/** exempt).
        # Split the 40 offenders under touch-it-you-fix-it, then step the budget
        # 1000 -> 800 -> 600, re-baselining the warning count at each step. When
        # the max-lines contribution reaches 0, promote the rule to `error`.
        #
        # NOTE: a crashed/misconfigured ESLint exits non-zero and is caught by
        # the separate lint_exit gate, so parsing an empty log as 0 warnings
        # cannot mask a failure.
        shell: bash
        run: |
          set +e
          npm run lint 2>&1 | tee quality-lint.log
          echo "${PIPESTATUS[0]}" > quality-lint.exit
          # Authoritative count = the summary tuple, e.g.
          #   "✖ 55 problems (0 errors, 55 warnings)".
          # Parsed from inside the parentheses ON PURPOSE: ESLint also prints
          # "0 errors and 1 warning potentially fixable with the `--fix` option",
          # and a looser pattern picks up that decoy number instead.
          # A fully clean run prints no summary at all -> 0.
          lint_warnings="$(grep -oE '\([0-9]+ errors?, [0-9]+ warnings?\)' quality-lint.log | tail -n1 | grep -oE '[0-9]+ warnings?' | grep -oE '^[0-9]+')"
          lint_warnings="${lint_warnings:-0}"
          echo "$lint_warnings" > quality-lint-warnings.count
          echo "ESLint warnings: $lint_warnings (ratchet floor: $(cat .eslint-warning-baseline 2>/dev/null || echo '?'))"
          exit 0

      - name: Run Prettier format check (blocking)
        # Repo-wide Prettier conformance. Safe to gate now that the golden-test-
        # pinned files are listed in .prettierignore: `prettier --check` is
        # read-only (it reformats nothing) and skips those files, so it can't trip
        # the source-introspection guardrails. Gated in "Enforce quality gates"
        # below so any unformatted file — which the bypassable Husky pre-commit
        # hook can miss (e.g. a `--no-verify` commit) — fails CI.
        shell: bash
        run: |
          set +e
          npm run format:check 2>&1 | tee quality-format.log
          echo "${PIPESTATUS[0]}" > quality-format.exit
          exit 0

      - name: Run middleware typecheck (blocking)
        # middleware.ts is compiled ONLY by Vercel's Edge build — invisible to
        # the Vite build and the SPA typecheck. This dedicated check is GATED
        # (see "Enforce quality gates") so a broken middleware (e.g. importing
        # the non-existent 'next/server') fails CI instead of only failing the
        # Vercel production deploy.
        shell: bash
        run: |
          set +e
          npm run typecheck:middleware 2>&1 | tee quality-typecheck-middleware.log
          echo "${PIPESTATUS[0]}" > quality-typecheck-middleware.exit
          exit 0

      - name: Run Deno typecheck (ratcheted)
        # Type-checks the Supabase Edge Function (Deno) source, which the SPA
        # typecheck (tsc) deliberately excludes because tsc can't resolve Deno's
        # npm:/jsr: specifiers. `deno check` follows the static import graph from
        # the function entry (index.tsx); because every route module is lazily
        # imported via a STRING-LITERAL dynamic import() in mount-*.ts, the whole
        # reachable backend (esign, integrations, all routes) is type-checked —
        # not just the boot graph.
        #
        # RATCHETED (not yet zero): the edge code carries a large pre-existing
        # type-error backlog (it was never tsc-checked). Rather than block on
        # zero, the "Enforce quality gates" step fails the job only if the error
        # count EXCEEDS the committed floor in .deno-check-baseline — so no NEW
        # edge type error (notably a used-but-unimported reference, the class
        # behind the OTP and `log` ReferenceErrors) can be introduced, while the
        # backlog is burned down over time. LOWER .deno-check-baseline as errors
        # are fixed; when it reaches 0, gate on `deno_exit` directly (and drop
        # the edge exclude note in tsconfig.typecheck.json) for a hard zero.
        shell: bash
        run: |
          set +e
          # NO_COLOR so Deno's "Found N errors" summary line parses cleanly.
          NO_COLOR=1 npm run typecheck:deno 2>&1 | tee quality-typecheck-deno.log
          echo "${PIPESTATUS[0]}" > quality-typecheck-deno.exit
          # Authoritative count = Deno's own summary ("Found N errors").
          # A clean exit (0) means no errors -> count 0.
          if [ "$(cat quality-typecheck-deno.exit)" = "0" ]; then
            deno_count=0
          else
            deno_count="$(grep -oE 'Found [0-9]+ error' quality-typecheck-deno.log | grep -oE '[0-9]+' | tail -n1)"
            deno_count="${deno_count:-999999}"
          fi
          echo "$deno_count" > quality-typecheck-deno.count
          echo "Deno type-error count: $deno_count (ratchet floor: $(cat .deno-check-baseline 2>/dev/null || echo '?'))"
          exit 0

      - name: Run FNA intake test suite
        shell: bash
        run: |
          set +e
          npm test -- src/supabase/functions/server/__tests__/fna-intake- src/components/client/fna-intake/__tests__/ src/shared/fna-intake/__tests__/ 2>&1 | tee quality-fna-intake-test.log
          echo "${PIPESTATUS[0]}" > quality-fna-intake-test.exit
          exit 0

      - name: Run form prefill test suite
        shell: bash
        run: |
          set +e
          npm test -- src/supabase/functions/server/__tests__/form-prefill- src/supabase/functions/server/__tests__/esign-prefill.test.ts src/components/admin/modules/risk-planning-fna/components/__tests__/Step1InformationGathering.prefill-guard.test.ts 2>&1 | tee quality-form-prefill-test.log
          echo "${PIPESTATUS[0]}" > quality-form-prefill-test.exit
          exit 0

      - name: Run dependency-cruiser (blocking)
        # Phase 7 boundary guardrails — three rules:
        #
        #   no-cross-feature-internals
        #     Feature modules under src/components/admin/modules/ communicate
        #     only through their public index barrel (index.tsx). Importing
        #     another module's hooks/, components/, api.ts, etc. directly is
        #     forbidden — it creates hidden coupling that makes refactors risky.
        #
        #   no-outsider-admin-internals
        #     Code outside the admin modules must likewise import only barrels.
        #
        #   no-spa-edge-source
        #     SPA source must not import Supabase Edge Function (Deno) code at
        #     runtime. Call those routes over HTTP; use `import type` for shared
        #     type definitions only. Belt-and-suspenders on top of the ESLint
        #     no-restricted-imports error that already enforces this.
        #
        # RATCHETED (2026-08-21, Stage A / F1): this gate used to report "no
        # violations" vacuously — the resolver had no `extensions` list, so
        # first-party TS never resolved and NO rule ever fired. With the
        # resolver fixed the rules work and expose a real pre-existing backlog
        # (210 violations), so the three rules are `warn` (depcruise exits 0)
        # and "Enforce quality gates" fails the job only if the violation count
        # EXCEEDS the committed floor in .depcruise-baseline — no NEW boundary
        # violation can be introduced while the backlog is burned down.
        # LOWER .depcruise-baseline as violations are fixed; at 0, flip the
        # rules back to `error` in .dependency-cruiser.cjs and gate on the exit
        # code directly for a hard zero.
        #
        # Config: .dependency-cruiser.cjs
        # Run locally: npm run depcruise
        shell: bash
        run: |
          set +e
          npx dependency-cruiser@16 'src/**/*.{ts,tsx}' --config .dependency-cruiser.cjs 2>&1 | tee quality-depcruise.log
          echo "${PIPESTATUS[0]}" > quality-depcruise.exit
          # Authoritative count = dep-cruiser's own summary line, e.g.
          #   "x 210 dependency violations (0 errors, 210 warnings)."
          # A clean run prints "no dependency violations found" (no number), so
          # an empty match means 0.
          depcruise_count="$(grep -oE '[0-9]+ dependency violations' quality-depcruise.log | grep -oE '^[0-9]+' | tail -n1)"
          depcruise_count="${depcruise_count:-0}"
          echo "$depcruise_count" > quality-depcruise.count
          echo "dependency-cruiser violations: $depcruise_count (ratchet floor: $(cat .depcruise-baseline 2>/dev/null || echo '?'))"
          exit 0

      - name: Check bundle size budget (ratcheted)
        # Stage A / F6. Nothing measured build output before this, so weight
        # could grow invisibly. Compares dist/ against the committed floors in
        # .bundle-size-baseline.json; "Enforce quality gates" fails the job if a
        # metric exceeds its floor + 5% headroom (exact-byte comparison would
        # fail on content-hash and ordinary-feature noise and get switched off).
        #
        # Runs after the build step, which produces dist/. If the build failed
        # there is no dist/ and this exits 2 (fails CLOSED) rather than looking
        # like a pass — the build gate reports the root cause.
        #
        # Two known problems this makes visible on every run, both pre-existing
        # and tracked, neither introduced here:
        #   * the eager entry graph (~659 KB gzipped) includes vendor-tiptap and
        #     vendor-jspdf — a rich-text editor and a PDF generator that every
        #     marketing-page visitor downloads;
        #   * imageBytes is ~864 MB because `figma:asset` imports resolve to raw
        #     multi-MB PNGs (remediation plan A7 — the .webp the resolver looks
        #     for in src/assets is never generated).
        # Re-baseline with `npm run bundle:check -- --write-baseline` when either
        # is fixed, so the win is locked in.
        shell: bash
        run: |
          set +e
          npm run bundle:check 2>&1 | tee quality-bundle-size.log
          echo "${PIPESTATUS[0]}" > quality-bundle-size.exit
          exit 0

      - name: Run dependency audit
        # RATCHETED (2026-08-21, Stage A / F7): this used to be `|| true` with no
        # threshold — a fresh critical CVE in a direct dependency could never fail
        # a PR, on a platform holding client financial/medical PII, ID documents
        # and digital signatures. Now the HIGH+CRITICAL count is compared against
        # the committed floor in .npm-audit-baseline by "Enforce quality gates";
        # the job fails if it RISES, so no new high/critical can be introduced
        # while the residual backlog is burned down.
        #
        # Floor is currently 0: `sharp` was upgraded to ^0.35.3 (libvips CVEs).
        # Keep the ratchet at 0 so a new high/critical fails the job.
        #
        # `|| true` is retained on the audit command itself because npm audit
        # exits non-zero whenever ANY vulnerability exists (including moderate/low,
        # which are not gated) — the count, not the exit code, is authoritative.
        shell: bash
        run: |
          set +e
          npm audit --json > quality-npm-audit-report.json
          audit_high="$(node -e "
            try {
              const r = require('./quality-npm-audit-report.json');
              const v = (r.metadata && r.metadata.vulnerabilities) || {};
              console.log((v.high || 0) + (v.critical || 0));
            } catch (e) { console.log('999999'); }
          ")"
          echo "$audit_high" > quality-npm-audit.count
          echo "npm audit high+critical: $audit_high (ratchet floor: $(cat .npm-audit-baseline 2>/dev/null || echo '?'))"
          exit 0

      - name: Publish quality issue snapshot
        shell: bash
        env:
          QUALITY_ISSUES_INGEST_URL: https://vpjmdsltwrnpefzcgdmz.supabase.co/functions/v1/make-server-91ed8379/quality-issues/ingest-ci-report
          QUALITY_ISSUES_INGEST_TOKEN: ${{ secrets.QUALITY_ISSUES_INGEST_TOKEN }}
        run: node scripts/publish-quality-report.mjs

      - name: Upload quality reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports
          path: |
            quality-build.log
            quality-build.exit
            quality-test.log
            quality-test.exit
            quality-typecheck.log
            quality-typecheck.exit
            quality-lint.log
            quality-lint.exit
            quality-format.log
            quality-format.exit
            quality-typecheck-middleware.log
            quality-typecheck-middleware.exit
            quality-typecheck-deno.log
            quality-typecheck-deno.exit
            quality-vitest-report.json
            quality-npm-audit-report.json
            quality-issues-payload.json
            quality-depcruise.log
            quality-depcruise.exit
            quality-depcruise.count
            quality-typecheck-deno.count
            quality-npm-audit.count
            quality-lint-warnings.count
            quality-bundle-size.log
            quality-bundle-size.exit
            quality-test-server.log
            quality-test-server.exit

      - name: Enforce quality gates
        # Runs last so the dashboard snapshot is published and artifacts are
        # uploaded even on failure, but the job still fails when build, tests,
        # the SPA typecheck, or the middleware typecheck failed. Previously these
        # exit codes were captured to files and then discarded (`set +e ... exit 0`),
        # so a red build/test could still report a green "Quality Check". The SPA
        # typecheck is now GATED here (it reached 0 errors — keep it there).
        if: always()
        shell: bash
        run: |
          build_exit="$(cat quality-build.exit 2>/dev/null || echo 1)"
          test_exit="$(cat quality-test.exit 2>/dev/null || echo 1)"
          typecheck_exit="$(cat quality-typecheck.exit 2>/dev/null || echo 1)"
          lint_exit="$(cat quality-lint.exit 2>/dev/null || echo 1)"
          format_exit="$(cat quality-format.exit 2>/dev/null || echo 1)"
          mw_exit="$(cat quality-typecheck-middleware.exit 2>/dev/null || echo 1)"
          deno_exit="$(cat quality-typecheck-deno.exit 2>/dev/null || echo 1)"
          depcruise_exit="$(cat quality-depcruise.exit 2>/dev/null || echo 1)"
          deno_count="$(cat quality-typecheck-deno.count 2>/dev/null | tr -dc '0-9')"; deno_count="${deno_count:-999999}"
          deno_baseline="$(cat .deno-check-baseline 2>/dev/null | tr -dc '0-9')"; deno_baseline="${deno_baseline:-0}"
          depcruise_count="$(cat quality-depcruise.count 2>/dev/null | tr -dc '0-9')"; depcruise_count="${depcruise_count:-999999}"
          depcruise_baseline="$(cat .depcruise-baseline 2>/dev/null | tr -dc '0-9')"; depcruise_baseline="${depcruise_baseline:-0}"
          audit_count="$(cat quality-npm-audit.count 2>/dev/null | tr -dc '0-9')"; audit_count="${audit_count:-999999}"
          audit_baseline="$(cat .npm-audit-baseline 2>/dev/null | tr -dc '0-9')"; audit_baseline="${audit_baseline:-0}"
          lint_warnings="$(cat quality-lint-warnings.count 2>/dev/null | tr -dc '0-9')"; lint_warnings="${lint_warnings:-999999}"
          lint_warn_baseline="$(cat .eslint-warning-baseline 2>/dev/null | tr -dc '0-9')"; lint_warn_baseline="${lint_warn_baseline:-0}"
          bundle_exit="$(cat quality-bundle-size.exit 2>/dev/null || echo 1)"
          server_cov_exit="$(cat quality-test-server.exit 2>/dev/null || echo 1)"
          echo "build exit code:           $build_exit"
          echo "test exit code:            $test_exit"
          echo "typecheck exit code:       $typecheck_exit"
          echo "lint exit code:            $lint_exit"
          echo "format check exit code:    $format_exit"
          echo "middleware typecheck code: $mw_exit"
          echo "dependency-cruiser code:   $depcruise_exit"
          echo "depcruise violations:      $depcruise_count (ratchet floor $depcruise_baseline)"
          echo "npm audit high+critical:   $audit_count (ratchet floor $audit_baseline)"
          echo "ESLint warnings:           $lint_warnings (ratchet floor $lint_warn_baseline)"
          echo "bundle size budget:        exit $bundle_exit (see quality-bundle-size.log)"
          echo "backend coverage floor:    exit $server_cov_exit (see quality-test-server.log)"
          echo "deno type-error count:     $deno_count (ratchet floor $deno_baseline; raw exit $deno_exit)"
          failed=0
          if [ "$build_exit" != "0" ]; then echo "::error::Production build failed (see quality-build.log)"; failed=1; fi
          if [ "$test_exit" != "0" ]; then echo "::error::Vitest suite failed (see quality-test.log)"; failed=1; fi
          if [ "$typecheck_exit" != "0" ]; then echo "::error::SPA typecheck failed — a new type error was introduced (baseline is 0). See quality-typecheck.log"; failed=1; fi
          if [ "$lint_exit" != "0" ]; then echo "::error::ESLint failed — a new lint error was introduced (baseline is 0 errors). See quality-lint.log"; failed=1; fi
          if [ "$format_exit" != "0" ]; then echo "::error::Prettier format check failed — run 'npm run format' to fix unformatted files (see quality-format.log)"; failed=1; fi
          if [ "$mw_exit" != "0" ]; then echo "::error::Middleware typecheck failed — middleware.ts must not import 'next/server' (see quality-typecheck-middleware.log)"; failed=1; fi
          if [ "$depcruise_exit" != "0" ]; then echo "::error::dependency-cruiser reported an ERROR-severity boundary violation (or failed to run) — a feature module is importing another module's internals, or SPA code is importing edge-function source at runtime. Fix the import or export through the module's index barrel. See quality-depcruise.log"; failed=1; fi
          if [ "$depcruise_count" -gt "$depcruise_baseline" ]; then
            echo "::error::Module-boundary violations rose to $depcruise_count (ratchet floor $depcruise_baseline) — a NEW cross-module/outsider import was introduced. Import through the module's public index barrel instead, or move the shared code to src/shared. If you deliberately changed the floor, update .depcruise-baseline. See quality-depcruise.log"
            failed=1
          elif [ "$depcruise_count" -lt "$depcruise_baseline" ]; then
            echo "::notice::Module-boundary violations dropped to $depcruise_count (below floor $depcruise_baseline) — tighten the ratchet by setting .depcruise-baseline to $depcruise_count."
          fi
          if [ "$audit_count" -gt "$audit_baseline" ]; then
            echo "::error::npm audit high/critical vulnerabilities rose to $audit_count (ratchet floor $audit_baseline) — a NEW high or critical advisory affects this dependency tree. Run 'npm audit' to see it and 'npm audit fix' for a non-breaking fix; pin/override or alias the package if no clean fix exists. If you deliberately accepted it, update .npm-audit-baseline WITH a justification comment in quality-check.yml. See quality-npm-audit-report.json"
            failed=1
          elif [ "$audit_count" -lt "$audit_baseline" ]; then
            echo "::notice::npm audit high/critical vulnerabilities dropped to $audit_count (below floor $audit_baseline) — tighten the ratchet by setting .npm-audit-baseline to $audit_count."
          fi
          if [ "$server_cov_exit" != "0" ]; then
            echo "::error::Backend (Edge Function) coverage fell below its floor, or its suite failed. The backend is measured separately from the SPA (vitest.config.server.ts) because it holds auth, client PII and e-signature logic. Add tests for the code you changed — contract tests in the esign-routes.contract.test.ts style are the highest-value kind. See quality-test-server.log"
            failed=1
          fi
          if [ "$bundle_exit" = "2" ]; then
            echo "::error::Bundle-size check could not run (missing dist/ or unreadable .bundle-size-baseline.json). If the production build failed, fix that first — this check needs its output. See quality-bundle-size.log"
            failed=1
          elif [ "$bundle_exit" != "0" ]; then
            echo "::error::Bundle-size budget exceeded — a metric grew past its floor + 5% headroom, usually because a large dependency was pulled into an eagerly-loaded chunk. Lazy-load it (React.lazy / dynamic import()), or re-baseline with 'npm run bundle:check -- --write-baseline' and justify it. See quality-bundle-size.log"
            failed=1
          fi
          if [ "$lint_warnings" -gt "$lint_warn_baseline" ]; then
            echo "::error::ESLint warnings rose to $lint_warnings (ratchet floor $lint_warn_baseline) — new lint warnings were introduced (e.g. a file over the 1000-line max-lines budget, a react-hooks/exhaustive-deps suppression, or an unused variable). Fix them, or if you deliberately changed the floor, update .eslint-warning-baseline. See quality-lint.log"
            failed=1
          elif [ "$lint_warnings" -lt "$lint_warn_baseline" ]; then
            echo "::notice::ESLint warnings dropped to $lint_warnings (below floor $lint_warn_baseline) — tighten the ratchet by setting .eslint-warning-baseline to $lint_warnings."
          fi
          if [ "$deno_count" -gt "$deno_baseline" ]; then
            echo "::error::Deno edge-code type errors rose to $deno_count (ratchet floor $deno_baseline) — a NEW edge-code type error was introduced (e.g. a used-but-unimported reference, the class behind the OTP/log ReferenceErrors). Fix it; or, if you deliberately changed the floor, update .deno-check-baseline. See quality-typecheck-deno.log"
            failed=1
          elif [ "$deno_count" -lt "$deno_baseline" ]; then
            echo "::notice::Deno edge-code type errors dropped to $deno_count (below floor $deno_baseline) — tighten the ratchet by setting .deno-check-baseline to $deno_count."
          fi
          if [ "$failed" != "0" ]; then
            echo "Quality gates FAILED."
            exit 1
          fi
          echo "Quality gates passed."
