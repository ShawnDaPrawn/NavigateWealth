# Deploy the Navigate Wealth Edge Function to Supabase on push to main.
#
# One-time setup (repo → Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN — create at https://supabase.com/dashboard/account/tokens
#
# Project ref is fixed in supabase/config.toml (vpjmdsltwrnpefzcgdmz).

# Trigger note: this workflow can be rerun via workflow_dispatch.
# Rollback a bad live revision with a SHA input (not --ref <sha> — gh only
# accepts a branch/tag for --ref, which would redeploy that branch's HEAD):
#   gh workflow run deploy-supabase-function.yml -f revision=<last-green-sha>
# CI trigger marker: token-variable verification.
name: Deploy Supabase Edge Function

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Git SHA or ref to deploy. Leave empty for the dispatched branch HEAD. For rollback, pass the last green commit SHA.
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - 'src/supabase/functions/**'
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/deploy-supabase-function.yml'
      - 'scripts/post-deploy-smoke.mjs'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.revision || github.sha }}

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy make-server-91ed8379
        env:
          SUPABASE_ACCESS_TOKEN_SECRET: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_ACCESS_TOKEN_VAR: ${{ vars.SUPABASE_ACCESS_TOKEN }}
        run: |
          TOKEN="${SUPABASE_ACCESS_TOKEN_SECRET:-$SUPABASE_ACCESS_TOKEN_VAR}"
          if [ -z "$TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is not set. Add it under Repository secrets or Repository variables."
            exit 1
          fi
          export SUPABASE_ACCESS_TOKEN="$TOKEN"
          supabase --version
          status=0
          for attempt in 1 2 3; do
            echo "Deploy attempt $attempt of 3"
            if [ "$attempt" -eq 3 ]; then
              supabase --debug functions deploy make-server-91ed8379 --project-ref vpjmdsltwrnpefzcgdmz --use-api --workdir . && exit 0
            else
              supabase functions deploy make-server-91ed8379 --project-ref vpjmdsltwrnpefzcgdmz --use-api --workdir . && exit 0
            fi
            status=$?
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 15))
            fi
          done
          echo "::error::Supabase Edge Function deploy failed after 3 attempts."
          exit "$status"

      # Blocking smoke (roadmap §8.1 / A8). Health must be 200; gated routes
      # must be 401. No secrets. A red result means the revision just deployed
      # is already live — rollback with
      # `gh workflow run deploy-supabase-function.yml -f revision=<last-green-sha>`
      # or by reverting the merge on main. Do not fix-forward a 200/401 inversion.
      - name: Setup Node.js for post-deploy smoke
        if: success()
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Blocking post-deploy smoke
        if: success()
        run: node ./scripts/post-deploy-smoke.mjs

      - name: Post-deploy form prefill API smoke
        if: success()
        continue-on-error: true
        env:
          E2E_FNA_ADVISER_EMAIL: ${{ secrets.E2E_FNA_ADVISER_EMAIL }}
          E2E_FNA_ADVISER_PASSWORD: ${{ secrets.E2E_FNA_ADVISER_PASSWORD }}
          E2E_FNA_CLIENT_ID: ${{ secrets.E2E_FNA_CLIENT_ID }}
        run: |
          if [ -z "$E2E_FNA_ADVISER_EMAIL" ] || [ -z "$E2E_FNA_ADVISER_PASSWORD" ] || [ -z "$E2E_FNA_CLIENT_ID" ]; then
            echo "Skipping form-prefill smoke — E2E_FNA_* secrets not configured."
            exit 0
          fi
          npm ci
          npm run form-prefill:smoke
