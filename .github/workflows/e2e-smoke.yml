# Public render smoke — the first e2e journey to run in CI (roadmap §8.3).
#
# WHY THIS IS A SEPARATE WORKFLOW, AND NOT YET A REQUIRED CHECK
# -------------------------------------------------------------
# Branch protection requires `quality-check`; this workflow is not in that list,
# so it REPORTS on every PR without being able to block a merge. That is
# deliberate for its first runs: a brand-new browser job that turns out to be
# flaky would block every PR, and the first thing anyone does with a gate that
# cries wolf is disable it — which is worse than never having added it.
#
# TO PROMOTE IT TO REQUIRED (do this after ~3 consecutive green runs):
#   Settings → Branches → main → Require status checks → add "e2e-smoke".
# No change to this file is needed.
#
# WHAT IT COVERS
# --------------
# That the application RUNS. `npm run build` proves the bundle compiles; it does
# not prove the app renders, and the two come apart exactly where it hurts — a
# lazy chunk that 404s after deploy, a provider that throws on mount, a router
# change that blanks a marketing route. All of those ship green today.
#
# It is credential-free by design, which is why it can run here at all: the
# other five specs in e2e/ are skipped without seeded accounts or signer tokens
# (§7 is blocked on those). It submits nothing — a real quote submission would
# create a live lead and fire two staff emails, because a preview build still
# talks to the production Edge Function.
name: E2E Smoke

on:
  pull_request:
  push:
    branches: [main]

jobs:
  e2e-smoke:
    name: e2e-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Only chromium: the specs run desktop + mobile viewports, both Chromium.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Build
        env:
          # The Supabase articles endpoint uses a host allowlist that blocks CI
          # runner IPs, and `requireArticles()` is strict whenever CI is set —
          # so generate-seo-files / apply-static-seo hard-fail on the blocked
          # fetch and this job never reaches Playwright. quality-check.yml sets
          # the same override on the same build for the same reason. Without it
          # this gate is one runner IP away from failing for a reason that has
          # nothing to do with whether the app renders.
          SEO_REQUIRE_ARTICLES: 'false'
        run: npm run build

      # Dependency-free readiness poll. `npx wait-on` would fetch a package at
      # job time, which is one more thing that can fail in a gate whose whole
      # purpose is to be trustworthy.
      - name: Serve the build
        run: |
          npx vite preview --port 4173 --strictPort &
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://localhost:4173/; then
              echo "preview up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "preview server did not come up within 60s"; exit 1

      - name: Run the public render smoke
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:4173
        run: npx playwright test e2e/public-render-smoke.spec.ts

      - name: Upload the report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
